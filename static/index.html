<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Reader AI Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:Georgia,serif;background:#fff;color:#000;font-size:18px}
#app{display:flex;flex-direction:column;height:100%}
#header{display:flex;align-items:center;padding:8px 12px;border-bottom:2px solid #000}
#header h1{font-size:20px;white-space:nowrap;flex-shrink:0;margin-right:8px}
#model-wrap{position:relative;flex:1;min-width:0;margin-right:8px}
#model-input{font-size:16px;padding:6px 8px;border:2px solid #000;font-family:inherit;cursor:pointer;background:#fff;width:100%}
#model-dropdown{display:none;position:absolute;top:100%;left:0;width:300px;max-height:200px;overflow-y:auto;background:#fff;border:2px solid #000;z-index:20}
.model-item{padding:10px 8px;cursor:pointer;font-size:16px;border-bottom:1px solid #ddd}
.model-item:last-child{border-bottom:none}
.model-item:active{background:#000;color:#fff}
#settings-btn{font-size:18px;padding:6px 14px;background:#000;color:#fff;border:none;cursor:pointer;border-radius:4px;flex-shrink:0}
#messages{flex:1;overflow-y:auto;padding:10px 12px}
.msg{margin-bottom:14px;line-height:1.5;word-wrap:break-word}
.msg-user{font-weight:bold}
.msg-assistant{white-space:pre-wrap}
#error{color:red;padding:10px 12px;display:none;font-size:16px}
#input-bar{border-top:2px solid #000;padding:8px;display:flex;gap:8px}
#msg-input{flex:1;font-size:16px;padding:8px;border:2px solid #000;font-family:inherit;resize:none;min-height:48px;max-height:120px}
#send-btn{font-size:16px;padding:8px 16px;background:#000;color:#fff;border:none;cursor:pointer;border-radius:4px;min-width:70px;margin-left:8px;}
#send-btn:disabled{opacity:.5;cursor:default}

/* Settings overlay */
#settings-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:10}
#settings-panel{background:#fff;margin:30px auto;padding:20px;border:2px solid #000;max-width:500px;width:90%}
#settings-panel h2{margin-bottom:14px;font-size:20px}
#settings-panel label{display:block;margin-bottom:4px;font-weight:bold;font-size:16px}
#settings-panel input{width:100%;font-size:16px;padding:8px;border:2px solid #000;margin-bottom:14px}
#settings-panel .btn-row{display:flex;gap:10px;margin-top:10px}
#settings-panel button{font-size:16px;padding:8px 16px;border:2px solid #000;cursor:pointer;border-radius:4px}
#save-btn{background:#000;color:#fff}
#cancel-btn{background:#fff;color:#000}
#fetch-models-btn{background:#fff;color:#000;margin-bottom:14px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>E-Reader AI Chat</h1>
    <span id="model-wrap"><input id="model-input" type="text" placeholder="Select model..." autocomplete="off"><div id="model-dropdown"></div></span>
    <button id="settings-btn">Settings</button>
  </div>
  <div id="error"></div>
  <div id="messages"></div>
  <div id="input-bar">
    <textarea id="msg-input" placeholder="Type a message..."></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>
<div id="settings-overlay">
  <div id="settings-panel">
    <h2>Session Settings</h2>
    <label for="cfg-url">Base URL</label>
    <input id="cfg-url" type="text" placeholder="http://192.168.1.17:1234/v1">
    <label for="cfg-model">Model Name</label>
    <input id="cfg-model" type="text" placeholder="e.g. llama-3.2">
    <button id="fetch-models-btn">Fetch Models</button>
    <label for="cfg-key">API Key (optional)</label>
    <input id="cfg-key" type="password" placeholder="sk-... or leave blank">
    <div class="btn-row">
      <button id="save-btn">Save</button>
      <button id="cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
